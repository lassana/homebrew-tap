name: Bump strawberry-music-player

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: strawberry-music-player-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/bump-cask.sh strawberry-music-player github
          strawberrymusicplayer/strawberry "strawberry-{version}.tar.xz"
