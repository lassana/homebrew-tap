name: Bump coolterm

on:
  schedule:
    - cron: "57 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency: coolterm-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update cask to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          .github/bump-cask.sh coolterm verfile
          https://freeware.the-meiers.org/version/CoolTerm.ver
          https://freeware.the-meiers.org/CoolTermMac.dmg
